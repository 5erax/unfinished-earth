name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: unfinished
          POSTGRES_PASSWORD: unfinished
          POSTGRES_DB: unfinished_earth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U unfinished -d unfinished_earth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://unfinished:unfinished@127.0.0.1:5432/unfinished_earth
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm typecheck
      - run: pnpm test:workspace
      - run: pnpm run check
      - run: pnpm test
      - run: pnpm build:workspace
      - run: pnpm build
