name: Deploy Vercel Production

on:
  push:
    branches:
      - codex/living-valley-gameplay
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Vercel build package manager
        run: npm install --global pnpm@10.17.1
      - name: Pull Vercel configuration
        run: npx vercel@59.25.0 pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Build production artifact
        run: npx vercel@59.25.0 build --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Deploy production artifact
        run: npx vercel@59.25.0 deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
