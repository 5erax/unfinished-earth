services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: unfinished
      POSTGRES_PASSWORD: unfinished
      POSTGRES_DB: unfinished_earth
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unfinished -d unfinished_earth"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
